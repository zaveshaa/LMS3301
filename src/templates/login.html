{% extends "base.html" %}
{% block title %}Sign In — LMS3301{% endblock %}
{% block content %}
<div class="card" style="max-width:400px; margin:48px auto; padding:36px;">
  <div style="width:44px; height:44px; border-radius:12px; background:linear-gradient(135deg,#6d5cff,#4f8cff); display:flex; align-items:center; justify-content:center; font-size:1.2rem; font-weight:800; color:#fff; margin-bottom:20px;">L</div>
  <h1>Welcome back</h1>
  <p class="meta" style="margin-bottom:24px;">Sign in to your LMS3301 account</p>
  <form method="post">
    <label for="login">Login</label>
    <input type="text" id="login" name="login" placeholder="Enter your login" required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Enter your password" required>
    <button class="btn" type="submit" style="width:100%; justify-content:center; margin-top:8px;">Sign in</button>
  </form>
</div>
{% endblock %}
