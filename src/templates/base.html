<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}LMS3301{% endblock %}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif; background: #f3f4f8; color: #17213a; min-height: 100vh; }

  header { background: #fff; border-bottom: 1px solid #e3e6ef; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; height: 56px; position: sticky; top: 0; z-index: 10; }
  header .logo { font-size: 1rem; font-weight: 700; text-decoration: none; color: #17213a; letter-spacing: .3px; }
  header nav { display: flex; gap: 18px; align-items: center; }
  header nav a { color: #4b5563; text-decoration: none; font-size: .85rem; font-weight: 500; }
  header nav a:hover { color: #2b3a63; }
  header .user-info { display: flex; align-items: center; gap: 10px; font-size: .85rem; color: #17213a; font-weight: 500; }
  header .role-badge { background: #eceff5; color: #2b3a63; font-size: .72rem; font-weight: 600; padding: 4px 10px; }

  main { max-width: 860px; margin: 40px auto; padding: 0 24px; }
  .card { background: #fff; border: 1px solid #e3e6ef; padding: 32px; margin-bottom: 18px; }
  .card h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 6px; color: #131c3a; }

  .flash { background: #fff8e1; border: 1px solid #e8d08a; color: #6b4e0a; padding: 12px 16px; margin-bottom: 18px; font-size: .85rem; }

  .btn { display: inline-flex; align-items: center; gap: 8px; background: #2b3a63; color: #fff; border: none; padding: 10px 22px; cursor: pointer; font-size: .9rem; font-weight: 600; text-decoration: none; transition: background .15s ease; }
  .btn:hover { background: #1f2a4a; }
  .btn-danger { background: #c0392b; }
  .btn-danger:hover { background: #a93226; }

  .btn-outline { display: inline-flex; align-items: center; gap: 8px; background: #fff; color: #4b5563; border: 1px solid #d9deeb; padding: 10px 22px; cursor: pointer; font-size: .9rem; font-weight: 500; text-decoration: none; transition: background .15s ease; }
  .btn-outline:hover { background: #f6f7fb; }

  input[type="text"], input[type="password"], textarea, select { width: 100%; padding: 10px 14px; border: 1px solid #d9deeb; font-size: .92rem; margin-bottom: 14px; background: #fff; color: #17213a; transition: border-color .15s ease; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #2b3a63; }

  label { display: block; font-size: .82rem; color: #5b6478; margin-bottom: 6px; font-weight: 500; }

  .meta { color: #8a93a8; font-size: .82rem; }

  .type-badge { font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; padding: 3px 8px; }
  .type-lecture { color: #1d4ed8; background: #eff6ff; }
  .type-practical { color: #065f46; background: #ecfdf5; }

  .work-item { display: flex; align-items: center; gap: 20px; background: #fff; border: 1px solid #e3e6ef; border-left: 4px solid #2b3a63; padding: 24px 26px; margin-bottom: 14px; text-decoration: none; color: inherit; transition: border-color .15s ease, background .15s ease; }
  .work-item:hover { border-color: #2b3a63; background: #fbfcff; }
  .work-item .work-body { flex: 1; }
  .work-item .work-title { font-size: 1.1rem; font-weight: 600; color: #131c3a; margin: 8px 0 4px; }
  .work-item .work-desc { font-size: .88rem; color: #6b7280; line-height: 1.45; }
  .work-item .work-arrow { font-size: 1.2rem; color: #b6bdc9; flex-shrink: 0; }

  .task-list { list-style: none; margin-top: 20px; }
  .task-list li { border-bottom: 1px solid #eceef4; }
  .task-list li:last-child { border-bottom: none; }
  .task-link { display: flex; align-items: center; gap: 16px; padding: 18px 8px; text-decoration: none; color: inherit; }
  .task-link:hover .task-name { color: #1d4ed8; }
  .task-link .task-no { width: 30px; height: 30px; border: 1px solid #d9deeb; color: #8a93a8; display: flex; align-items: center; justify-content: center; font-size: .8rem; flex-shrink: 0; font-family: "SF Mono", Menlo, monospace; }
  .task-link .task-name { font-size: .98rem; font-weight: 500; color: #17213a; }

  .page-title { font-weight: 700; margin-bottom: 4px; }
  .back-link { color: #4b5563; text-decoration: none; font-size: .85rem; }
  .back-link:hover { color: #1d4ed8; }

  .section-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .8px; font-weight: 600; color: #8a93a8; margin: 30px 0 12px; }

  .task-statement { font-family: Georgia, "Times New Roman", "Liberation Serif", serif; font-size: 1.04rem; line-height: 1.75; color: #111827; white-space: pre-line; border-left: 3px solid #2b3a63; padding: 2px 0 2px 20px; margin-top: 16px; }

  .examples-table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  .examples-table th { text-align: left; font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .5px; color: #4b5563; background: #f6f7fb; padding: 10px 14px; border: 1px solid #d9deeb; }
  .examples-table td { padding: 12px 14px; border: 1px solid #eceef4; vertical-align: top; }
  .examples-table td.mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: .86rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }

  .code-editor { width: 100%; min-height: 260px; padding: 14px; border: 1px solid #d9deeb; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: .88rem; line-height: 1.5; background: #fff; color: #17213a; resize: vertical; margin-bottom: 10px; }
  .code-editor:focus { outline: none; border-color: #2b3a63; }
  .solution-actions { display: flex; gap: 12px; }

  .placeholder-note { border: 1px dashed #d9deeb; padding: 22px; color: #8a93a8; font-size: .88rem; }
</style>
</head>
<body>
<header>
  <a class="logo" href="{{ url_for('home') if current_login else url_for('login') }}">LMS3301</a>
  {% if current_login %}
  <nav>
    {% if current_role == 'student' %}
    <a href="{{ url_for('student_cabinet') }}">Работы</a>
    {% endif %}
    <span class="user-info">{{ current_login }}<span class="role-badge">{{ role_label }}</span></span>
    <a href="{{ url_for('logout') }}">Выйти</a>
  </nav>
  {% endif %}
</header>
<main>
  {% with msgs = get_flashed_messages() %}
    {% if msgs %}<div class="flash">{{ msgs[0] }}</div>{% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
