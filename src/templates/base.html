<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}LMS3301{% endblock %}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: #fafafa; color: #333; min-height: 100vh; }
  header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 48px; }
  header .logo { font-size: .95rem; font-weight: 600; text-decoration: none; color: #333; letter-spacing: .5px; }
  header nav { display: flex; gap: 14px; align-items: center; }
  header nav a { color: #888; text-decoration: none; font-size: .8rem; }
  header nav a:hover { color: #333; }
  header .user-info { color: #999; font-size: .8rem; }
  header .role-badge { color: #333; font-size: .7rem; margin-left: 6px; padding: 1px 6px; border: 1px solid #ddd; }
  main { max-width: 720px; margin: 40px auto; padding: 0 20px; }
  .card { background: #fff; border: 1px solid #e8e8e8; padding: 24px; margin-bottom: 16px; }
  .card h1 { font-size: 1.1rem; font-weight: 600; margin-bottom: 10px; color: #222; }
  .flash { background: #fff8e1; border: 1px solid #f0d98c; padding: 10px 14px; margin-bottom: 16px; font-size: .85rem; }
  .btn { display: inline-block; background: #333; color: #fff; border: none; padding: 8px 18px; cursor: pointer; font-size: .85rem; text-decoration: none; }
  .btn:hover { background: #111; }
  .btn-danger { background: #c0392b; }
  .btn-danger:hover { background: #a93226; }
  input[type="text"], input[type="password"] { width: 100%; padding: 8px 12px; border: 1px solid #ddd; font-size: .9rem; margin-bottom: 10px; background: #fafafa; }
  input:focus { outline: none; border-color: #999; }
  label { display: block; font-size: .78rem; color: #888; margin-bottom: 3px; text-transform: uppercase; letter-spacing: .5px; }
  .meta { color: #aaa; font-size: .8rem; }
</style>
</head>
<body>
<header>
  <a class="logo" href="{{ url_for('home' if current_login else 'login') }}">LMS3301</a>
  {% if current_login %}
  <nav>
    <span class="user-info">{{ current_login }}<span class="role-badge">{{ role_label }}</span></span>
    <a href="{{ url_for('logout') }}">Logout</a>
  </nav>
  {% endif %}
</header>
<main>
  {% with msgs = get_flashed_messages() %}
    {% if msgs %}<div class="flash">{{ msgs[0] }}</div>{% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
