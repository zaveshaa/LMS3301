<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}LMS3301{% endblock %}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; }
  header { background: #1a1a2e; color: #fff; padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; }
  header .logo { font-size: 1.2rem; font-weight: 700; text-decoration: none; color: #fff; }
  header nav { display: flex; gap: 16px; align-items: center; }
  header nav a { color: #ccc; text-decoration: none; font-size: .9rem; }
  header nav a:hover { color: #fff; }
  header .user-info { color: #aaa; font-size: .85rem; }
  header .role-badge { background: #3b82f6; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: .75rem; margin-left: 6px; }
  main { max-width: 960px; margin: 32px auto; padding: 0 20px; }
  .card { background: #fff; border-radius: 10px; padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 20px; }
  .card h1 { font-size: 1.4rem; margin-bottom: 12px; }
  .flash { background: #fef3c7; border: 1px solid #fde68a; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: .9rem; }
  .btn { display: inline-block; background: #3b82f6; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: .95rem; text-decoration: none; }
  .btn:hover { background: #2563eb; }
  .btn-danger { background: #ef4444; }
  .btn-danger:hover { background: #dc2626; }
  input[type="text"], input[type="password"] { width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: .95rem; margin-bottom: 12px; }
  input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
  label { display: block; font-size: .85rem; color: #555; margin-bottom: 4px; }
  .meta { color: #6b7280; font-size: .85rem; }
</style>
</head>
<body>
<header>
  <a class="logo" href="{{ url_for('home' if current_login else 'login') }}">LMS3301</a>
  {% if current_login %}
  <nav>
    <span class="user-info">{{ current_login }}<span class="role-badge">{{ role_label }}</span></span>
    <a href="{{ url_for('logout') }}">Logout</a>
  </nav>
  {% endif %}
</header>
<main>
  {% with msgs = get_flashed_messages() %}
    {% if msgs %}<div class="flash">{{ msgs[0] }}</div>{% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
