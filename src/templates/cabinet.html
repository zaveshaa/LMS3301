{% extends "base.html" %}
{% block title %}My Works — LMS3301{% endblock %}
{% block content %}
<div class="card">
  <h1>My Works</h1>
  <p class="meta" style="margin-bottom:20px;">Lectures and practical works of the course.</p>
  {% for w in works %}
  <a class="work-item" href="{{ url_for('student_work', work_id=w.id) }}">
    <span class="type-badge {{ 'type-lecture' if w['type'] == 'lecture' else 'type-practical' }}">
      {{ type_label[w['type']] }}
    </span>
    <div class="work-title">{{ w.title }}</div>
    <div class="work-desc">{{ w.description }}</div>
  </a>
  {% endfor %}
</div>
{% endblock %}
