{% extends "base.html" %}
{% block title %}My Works — LMS3301{% endblock %}
{% block content %}
<div class="card">
  <h1>My Works</h1>
  <p class="meta" style="margin-bottom:16px;">Lectures and practical works of the course.</p>
  <table class="table">
    <thead>
      <tr><th>Title</th><th>Type</th><th style="width:40%">Description</th></tr>
    </thead>
    <tbody>
      {% for w in works %}
      <tr onclick="location.href='{{ url_for('student_work', work_id=w.id) }}'" style="cursor:pointer">
        <td><a href="{{ url_for('student_work', work_id=w.id) }}">{{ w.title }}</a></td>
        <td>
          <span class="type-badge {{ 'type-lecture' if w['type'] == 'lecture' else 'type-practical' }}">
            {{ type_label[w['type']] }}
          </span>
        </td>
        <td class="meta">{{ w.description }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
